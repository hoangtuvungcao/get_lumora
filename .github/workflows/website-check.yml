name: Website checks
on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/**', 'test/**', 'package*.json', '.github/workflows/website-check.yml']
  pull_request:
    paths: ['site/**', 'tools/**', 'test/**', 'package*.json', '.github/workflows/website-check.yml']
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run check
